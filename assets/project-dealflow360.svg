<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" role="img" aria-labelledby="t d">
  <title id="t">DealFlow360 — B2B sales operations and quote-to-cash platform</title>
  <desc id="d">Project card for DealFlow360. Engineering highlights: multi-tier discount governance, greedy set-cover allocation across warehouses, hybrid subscription proration, a blended discount risk score, and a role-based access matrix over an eleven-table relational schema. A schematic shows the quote-to-cash pipeline: Quote, Discount, Allocate, Invoice. Built with Next.js, React, TypeScript, Supabase, PostgreSQL, Tailwind CSS and Clerk.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .draw { stroke-dashoffset: 0; }

      @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      /* dashed connector scrolls to read as data moving down the pipeline */
      @keyframes flow { to { stroke-dashoffset: -112; } }
      @keyframes ping { 0% { opacity: .9; r: 4; } 70%, 100% { opacity: 0; r: 12; } }

      .a-head  { animation: fade .5s ease-out both; }
      .a-rule  { animation: draw .75s cubic-bezier(.4,0,.2,1) .15s both; }
      .a-title { animation: rise .6s cubic-bezier(.2,.7,.3,1) .3s both; }
      .a-sub   { animation: rise .6s cubic-bezier(.2,.7,.3,1) .45s both; }
      .a-feat  { animation: rise .5s cubic-bezier(.2,.7,.3,1) both; }
      .a-node  { animation: fade .5s ease-out both; }
      .a-pipe  { animation: draw 1.1s cubic-bezier(.4,0,.2,1) .7s both; }
      .a-flow  { animation: flow 3.4s linear 1.8s infinite; }
      .a-ping  { animation: ping 2.8s ease-out infinite; }
      .a-chip  { animation: rise .45s cubic-bezier(.2,.7,.3,1) both; }

      @media (prefers-reduced-motion: reduce) {
        .a-head, .a-rule, .a-title, .a-sub, .a-feat, .a-node,
        .a-pipe, .a-flow, .a-ping, .a-chip { animation: none !important; }
        .a-ping { opacity: 0; }
      }
    ]]></style>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#161B1C" stroke-width="1"/>
    </pattern>
    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1440" height="620" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1440" height="620" fill="#0A0C0D"/>
    <rect width="1440" height="620" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1439" height="619" rx="4" fill="none" stroke="#232A2B"/>

  <g class="a-head" stroke="#00E676" stroke-width="1.5" fill="none" opacity=".7">
    <path d="M18 38V18h20M1422 38V18h-20M18 582v20h20M1422 582v20h-20"/>
  </g>

  <!-- ============================ left column ======================= -->
  <g class="a-head">
    <text class="mono" x="56" y="74" font-size="12.5" fill="#5F6A6B" letter-spacing="2.4">01 &#8212; FLAGSHIP PROJECT</text>
  </g>
  <path class="draw a-rule" style="--len:640" d="M56 94h640" stroke="url(#ruleFade)" stroke-width="1.5"
        stroke-dasharray="640" fill="none"/>

  <g class="a-title">
    <text class="mono" x="56" y="158" font-size="48" font-weight="700" fill="#E9EFEF">DealFlow360</text>
  </g>
  <g class="a-sub">
    <text class="mono" x="56" y="192" font-size="16" fill="#8A9697">B2B Sales Operations &#183; Quote-to-Cash Platform</text>
  </g>

  <!-- engineering highlights, all drawn from the project's own README -->
  <g font-size="15" class="mono">
    <g class="a-feat" style="animation-delay:.62s">
      <path d="M58 237h10" stroke="#00E676" stroke-width="2"/>
      <text x="80" y="242" fill="#C7D0D0">Multi-tier discount governance with approval thresholds</text>
    </g>
    <g class="a-feat" style="animation-delay:.72s">
      <path d="M58 275h10" stroke="#00E676" stroke-width="2"/>
      <text x="80" y="280" fill="#C7D0D0">Greedy set-cover allocation across multiple warehouses</text>
    </g>
    <g class="a-feat" style="animation-delay:.82s">
      <path d="M58 313h10" stroke="#00E676" stroke-width="2"/>
      <text x="80" y="318" fill="#C7D0D0">Hybrid subscription proration and renewal handling</text>
    </g>
    <g class="a-feat" style="animation-delay:.92s">
      <path d="M58 351h10" stroke="#00E676" stroke-width="2"/>
      <text x="80" y="356" fill="#C7D0D0">Blended discount risk score surfaced to approvers</text>
    </g>
    <g class="a-feat" style="animation-delay:1.02s">
      <path d="M58 389h10" stroke="#00E676" stroke-width="2"/>
      <text x="80" y="394" fill="#C7D0D0">Role-based access matrix over an 11-table schema</text>
    </g>
    <g class="a-feat" style="animation-delay:1.12s">
      <path d="M58 427h10" stroke="#00E676" stroke-width="2"/>
      <text x="80" y="432" fill="#C7D0D0">Customer portal with negotiation round-trips</text>
    </g>
  </g>

  <!-- stack chips -->
  <g class="mono" font-size="13">
    <g class="a-chip" style="animation-delay:1.22s"><rect x="56" y="502" width="78" height="28" rx="3" fill="#101314" stroke="#232A2B"/><text x="95" y="521" fill="#00E676" text-anchor="middle">Next.js</text></g>
    <g class="a-chip" style="animation-delay:1.28s"><rect x="142" y="502" width="66" height="28" rx="3" fill="#101314" stroke="#232A2B"/><text x="175" y="521" fill="#00E676" text-anchor="middle">React</text></g>
    <g class="a-chip" style="animation-delay:1.34s"><rect x="216" y="502" width="104" height="28" rx="3" fill="#101314" stroke="#232A2B"/><text x="268" y="521" fill="#00E676" text-anchor="middle">TypeScript</text></g>
    <g class="a-chip" style="animation-delay:1.40s"><rect x="328" y="502" width="92" height="28" rx="3" fill="#101314" stroke="#232A2B"/><text x="374" y="521" fill="#00E676" text-anchor="middle">Supabase</text></g>
    <g class="a-chip" style="animation-delay:1.46s"><rect x="428" y="502" width="104" height="28" rx="3" fill="#101314" stroke="#232A2B"/><text x="480" y="521" fill="#00E676" text-anchor="middle">PostgreSQL</text></g>
    <g class="a-chip" style="animation-delay:1.52s"><rect x="540" y="502" width="112" height="28" rx="3" fill="#101314" stroke="#232A2B"/><text x="596" y="521" fill="#00E676" text-anchor="middle">Tailwind CSS</text></g>
    <g class="a-chip" style="animation-delay:1.58s"><rect x="660" y="502" width="62" height="28" rx="3" fill="#101314" stroke="#232A2B"/><text x="691" y="521" fill="#00E676" text-anchor="middle">Clerk</text></g>
  </g>

  <!-- =================== right: quote-to-cash schematic ============== -->
  <g transform="translate(818 0)">
    <path class="draw a-pipe" style="--len:560" d="M160 118v384" stroke="#232A2B" stroke-width="1.5"
          stroke-dasharray="560" fill="none"/>
    <!-- flowing data along the pipeline -->
    <path class="a-flow" d="M160 118v384" stroke="#00E676" stroke-width="1.5" fill="none"
          stroke-dasharray="6 50" opacity=".85"/>

    <g class="mono" font-size="14">
      <g class="a-node" style="animation-delay:.95s">
        <circle class="a-ping" cx="160" cy="138" r="4" fill="none" stroke="#00E676" stroke-width="1.2"/>
        <circle cx="160" cy="138" r="5.5" fill="#0A0C0D" stroke="#00E676" stroke-width="2"/>
        <text x="196" y="143" fill="#E9EFEF">QUOTE</text>
        <text x="196" y="163" font-size="12" fill="#5F6A6B">line items, terms, validity</text>
      </g>
      <g class="a-node" style="animation-delay:1.08s">
        <circle class="a-ping" cx="160" cy="258" r="4" fill="none" stroke="#00E676" stroke-width="1.2" style="animation-delay:.7s"/>
        <circle cx="160" cy="258" r="5.5" fill="#0A0C0D" stroke="#00E676" stroke-width="2"/>
        <text x="196" y="263" fill="#E9EFEF">DISCOUNT</text>
        <text x="196" y="283" font-size="12" fill="#5F6A6B">tiered rules, risk score, approval</text>
      </g>
      <g class="a-node" style="animation-delay:1.21s">
        <circle class="a-ping" cx="160" cy="378" r="4" fill="none" stroke="#00E676" stroke-width="1.2" style="animation-delay:1.4s"/>
        <circle cx="160" cy="378" r="5.5" fill="#0A0C0D" stroke="#00E676" stroke-width="2"/>
        <text x="196" y="383" fill="#E9EFEF">ALLOCATE</text>
        <text x="196" y="403" font-size="12" fill="#5F6A6B">set-cover across warehouses</text>
      </g>
      <g class="a-node" style="animation-delay:1.34s">
        <circle class="a-ping" cx="160" cy="498" r="4" fill="none" stroke="#00E676" stroke-width="1.2" style="animation-delay:2.1s"/>
        <circle cx="160" cy="498" r="5.5" fill="#0A0C0D" stroke="#00E676" stroke-width="2"/>
        <text x="196" y="503" fill="#E9EFEF">INVOICE</text>
        <text x="196" y="523" font-size="12" fill="#5F6A6B">proration, renewals, portal</text>
      </g>
    </g>

    <g class="a-head" style="animation-delay:.5s">
      <text class="mono" x="160" y="86" font-size="11.5" fill="#5F6A6B" letter-spacing="2" text-anchor="start">PIPELINE</text>
    </g>
  </g>
</svg>
