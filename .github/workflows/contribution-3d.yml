name: 3D contribution calendar

on:
  schedule:
    - cron: "37 2 * * *"   # once a day, offset from the snake job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # The action emits ten themes (~2.2 MB). Committing all of them daily
      # would grow the repo by roughly a gigabyte a year, so keep only the one
      # the README actually renders and drop the rest before staging.
      - name: Keep only the theme the README uses
        run: |
          set -euo pipefail
          KEEP=profile-3d-contrib/profile-night-green.svg
          [ -s "$KEEP" ] || { echo "::error::$KEEP was not generated"; exit 1; }
          head -c 256 "$KEEP" | grep -q '<svg' \
            || { echo "::error::$KEEP does not look like an SVG"; exit 1; }
          echo "ok  $KEEP  ($(wc -c < "$KEEP") bytes)"
          find profile-3d-contrib -name '*.svg' ! -name 'profile-night-green.svg' -delete

      - name: Commit if the calendar changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-green.svg
          if git diff --cached --quiet; then
            echo "calendar unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh 3D contribution calendar"
          git push
