<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Aakash Amreliya — Full Stack Developer and Web Engineer</title>
  <desc id="d">Dark technical banner reading AMRELIYA slash slash DIGITAL WORKSHOP, an interlocking AA monogram, the name AAKASH AMRELIYA, the role Full Stack Developer and Web Engineer, and the line Building useful products. Engineering better experiences.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      /* ---- design tokens ---------------------------------------------- */
      /* bg #0A0C0D  panel #101314  grid #161B1C  hairline #232A2B
         gray #5F6A6B  gray-lt #8A9697  white #E9EFEF  green #00E676   */

      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }

      /* base state is always the FINAL, legible state so that
         prefers-reduced-motion (and any renderer that ignores CSS
         animation) shows a complete, designed composition.            */
      .draw      { stroke-dashoffset: 0; }
      .fade      { opacity: 1; }
      .rise      { transform: none; }

      /* ---- timing system ---------------------------------------------- */
      /* entrance beats: 0.0s label - 0.25s monogram - 0.9s wordmark
         1.35s rule - 1.55s role - 1.75s tagline - 2.0s terminal        */
      @keyframes draw   { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
      @keyframes fade   { from { opacity: 0; }                   to { opacity: 1; } }
      @keyframes rise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes slide  { from { transform: translateX(-880px); } to { transform: none; } }
      @keyframes blink  { 0%, 48% { opacity: 1; } 52%, 100% { opacity: 0; } }
      @keyframes pulse  { 0% { r: 4; opacity: .9; } 70% { r: 13; opacity: 0; } 100% { r: 13; opacity: 0; } }
      @keyframes breathe{ 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes sweep  { 0% { transform: translateX(-340px); } 100% { transform: translateX(1200px); } }
      @keyframes travel { 0% { offset-distance: 0%; opacity: 0; }
                          12% { opacity: 1; }
                          88% { opacity: 1; }
                          100% { offset-distance: 100%; opacity: 0; } }
      @keyframes spin   { to { transform: rotate(360deg); } }

      .a-label    { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
      .a-mono1    { animation: draw 1.05s cubic-bezier(.4,0,.2,1) .25s both; }
      .a-mono2    { animation: draw 1.05s cubic-bezier(.4,0,.2,1) .45s both; }
      .a-monobar1 { animation: draw .32s ease-out 1.15s both; }
      .a-monobar2 { animation: draw .32s ease-out 1.30s both; }
      .a-bracket  { animation: fade .5s ease-out 1.45s both; }
      .a-word     { animation: rise .7s cubic-bezier(.2,.7,.3,1) .9s both; }
      .a-rule     { animation: draw .8s cubic-bezier(.4,0,.2,1) 1.35s both; }
      .a-role     { animation: rise .55s cubic-bezier(.2,.7,.3,1) 1.55s both; }
      .a-tag      { animation: rise .6s cubic-bezier(.2,.7,.3,1) 1.75s both; }
      .a-panel    { animation: fade .5s ease-out 2.0s both; }
      .a-clip     { animation: slide 2.4s steps(42, end) 2.2s both; }
      .a-cursor   { animation: fade .1s linear 2.2s both, blink 1.05s step-end 2.2s infinite; }
      .a-trace    { animation: draw 1.6s cubic-bezier(.4,0,.2,1) 1.1s both; }
      .a-dot      { animation: fade .4s ease-out 2.4s both, breathe 2.6s ease-in-out 2.4s infinite; }
      .a-ring     { animation: pulse 2.6s ease-out 2.4s infinite; }
      .a-sweep    { animation: sweep 11s linear 2.6s infinite; }
      .a-arc      { animation: spin 26s linear infinite; transform-origin: 1012px 186px; }
      .a-arc-rev  { animation: spin 38s linear infinite reverse; transform-origin: 1012px 186px; }

      @media (prefers-reduced-motion: reduce) {
        .a-label, .a-mono1, .a-mono2, .a-monobar1, .a-monobar2, .a-bracket,
        .a-word, .a-rule, .a-role, .a-tag, .a-panel, .a-clip, .a-cursor,
        .a-trace, .a-dot, .a-ring, .a-sweep, .a-arc, .a-arc-rev {
          animation: none !important;
        }
        .a-ring { opacity: 0; }
      }
    ]]></style>

    <!-- static technical grid -->
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#161B1C" stroke-width="1"/>
    </pattern>

    <!-- scanning highlight -->
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00E676" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#00E676" stop-opacity=".055"/>
      <stop offset="1"   stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>

    <!-- rule fades out to the right -->
    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00E676"/>
      <stop offset=".35" stop-color="#00E676" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect x="0" y="0" width="1200" height="380" rx="4"/></clipPath>

    <!-- character-by-character reveal for the terminal line -->
    <clipPath id="type"><rect class="a-clip" x="256" y="296" width="880" height="44"/></clipPath>
  </defs>

  <!-- ============================ canvas ============================ -->
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#0A0C0D"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect class="a-sweep" x="0" y="0" width="340" height="380" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="4" fill="none" stroke="#232A2B"/>

  <!-- registration / crop marks -->
  <g class="a-bracket" stroke="#00E676" stroke-width="1.5" fill="none" opacity=".75">
    <path d="M16 34V16h18M1184 34V16h-18M16 346v18h18M1184 346v18h-18"/>
  </g>

  <!-- ========================= top label row ======================== -->
  <g class="a-label">
    <text class="mono" x="44" y="48" font-size="12.5" fill="#5F6A6B"
          textLength="300" lengthAdjust="spacing">AMRELIYA // DIGITAL WORKSHOP</text>
  </g>
  <g class="a-label" style="animation-delay:.1s">
    <text class="mono" x="1156" y="48" font-size="12.5" fill="#5F6A6B" text-anchor="end"
          textLength="108" lengthAdjust="spacing">IN DEVELOPMENT</text>
    <circle class="a-ring" cx="1030" cy="43.5" r="4" fill="none" stroke="#00E676" stroke-width="1.2"/>
    <circle class="a-dot"  cx="1030" cy="43.5" r="4" fill="#00E676"/>
  </g>
  <path class="draw a-rule" style="--len:1112" d="M44 68h1112" stroke="#232A2B" stroke-width="1"
        stroke-dasharray="1112" fill="none"/>

  <!-- ====================== AA monogram (vector) ==================== -->
  <!-- Letterforms are drawn as geometry, not type, so the mark renders
       identically on every platform regardless of installed fonts.      -->
  <g transform="translate(76 116)" fill="none" stroke-linecap="square">
    <!-- bracket around the mark -->
    <g class="a-bracket" stroke="#232A2B" stroke-width="1.5">
      <path d="M-16 -8v-12h16M140 -8v-12h-16M-16 112v12h16M140 112v12h-16"/>
    </g>
    <!-- back A -->
    <path class="draw a-mono1" style="--len:242" d="M0 96 37 0 74 96"
          stroke="#E9EFEF" stroke-width="7" stroke-dasharray="242"/>
    <path class="draw a-monobar1" style="--len:51" d="M11.6 66h50.8"
          stroke="#E9EFEF" stroke-width="7" stroke-dasharray="51"/>
    <!-- front A, offset to interlock -->
    <path class="draw a-mono2" style="--len:242" d="M50 96 87 0 124 96"
          stroke="#00E676" stroke-width="7" stroke-dasharray="242"/>
    <path class="draw a-monobar2" style="--len:51" d="M61.6 66h50.8"
          stroke="#00E676" stroke-width="7" stroke-dasharray="51"/>
  </g>

  <!-- =========================== wordmark ========================== -->
  <g class="rise a-word">
    <text class="mono" x="256" y="168" font-size="54" font-weight="700" fill="#E9EFEF"
          textLength="580" lengthAdjust="spacing">AAKASH AMRELIYA</text>
  </g>

  <path class="draw a-rule" style="--len:580" d="M256 190h580" stroke="url(#ruleFade)"
        stroke-width="2" stroke-dasharray="580" fill="none"/>

  <g class="rise a-role">
    <text class="mono" x="256" y="217" font-size="13.5" fill="#8A9697"
          textLength="392" lengthAdjust="spacing">FULL STACK DEVELOPER &#183; WEB ENGINEER</text>
  </g>

  <g class="rise a-tag">
    <text class="mono" x="256" y="256" font-size="18" fill="#C7D0D0">Building useful products. Engineering better experiences.</text>
  </g>

  <!-- ======================== terminal strip ======================= -->
  <g class="fade a-panel">
    <rect x="256.5" y="296.5" width="879" height="44" rx="3" fill="#101314" stroke="#232A2B"/>
    <circle cx="276" cy="318.5" r="2.5" fill="#00E676" opacity=".8"/>
    <text class="mono" x="290" y="323" font-size="14.5" fill="#00E676">$</text>
  </g>
  <g clip-path="url(#type)">
    <text class="mono" x="306" y="323" font-size="14.5" fill="#8A9697">whoami --stack</text>
    <text class="mono" x="430" y="323" font-size="14.5" fill="#C7D0D0">react &#183; next.js &#183; node &#183; express &#183; mongodb &#183; typescript</text>
  </g>
  <rect class="a-cursor" x="906" y="309" width="8" height="19" fill="#00E676" opacity="0"/>

  <!-- ================= right-hand technical motif ================== -->
  <g fill="none">
    <!-- slow concentric arcs -->
    <g class="a-arc" stroke="#232A2B" stroke-width="1.5">
      <path d="M1012 118a68 68 0 0 1 68 68" stroke-dasharray="4 9"/>
      <path d="M1012 254a68 68 0 0 1-68-68" stroke-dasharray="4 9"/>
    </g>
    <g class="a-arc-rev" stroke="#00E676" stroke-width="1.5" opacity=".5">
      <path d="M1012 142a44 44 0 0 1 44 44"/>
    </g>
    <circle cx="1012" cy="186" r="3" fill="#00E676" opacity=".9"/>

    <!-- circuit trace that draws itself in -->
    <path class="draw a-trace" style="--len:420"
          d="M900 148h44a10 10 0 0 0 10-10v-18h52"
          stroke="#2E3738" stroke-width="1.5" stroke-dasharray="420"/>
    <path class="draw a-trace" style="--len:420"
          d="M900 230h44a10 10 0 0 1 10 10v16h52"
          stroke="#2E3738" stroke-width="1.5" stroke-dasharray="420"/>
    <g fill="#2E3738">
      <circle cx="1006" cy="120" r="2.5"/>
      <circle cx="1006" cy="256" r="2.5"/>
    </g>

    <!-- tick scale -->
    <g stroke="#1F2526" stroke-width="1.5">
      <path d="M1128 132h14M1128 156h8M1128 180h8M1128 204h8M1128 228h8M1128 252h14"/>
    </g>
  </g>
</svg>
